          trigger_prototypes:
            - uuid: b2b2177481b14a8b9d2e5f1a3b6c8d4e
              expression: 'last(/Barracuda WAF by SNMP/barracuda.net.oper.status[{#IFNAME}])=2 and last(/Barracuda WAF by SNMP/barracuda.net.admin.status[{#IFNAME}])=1'
              name: 'Interface [{#IFNAME}] is down'
              event_name: 'Interface [{#IFNAME}] is down'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability

            - uuid: c3c3288592c24a8a8b3d7e4f1a3b5c7d
              expression: 'last(/Barracuda WAF by SNMP/barracuda.net.in.error[{#IFNAME}])>last(/Barracuda WAF by SNMP/barracuda.net.in.error[{#IFNAME}],#2) or last(/Barracuda WAF by SNMP/barracuda.net.out.error[{#IFNAME}])>last(/Barracuda WAF by SNMP/barracuda.net.out.error[{#IFNAME}],#2)'
              name: 'There are errors on the network interface [{#IFNAME}]'
              event_name: 'There are errors on the network interface [{#IFNAME}]'
              priority: WARNING
              tags:

                - tag: service
                  value: '{#SVCNAME}'
              trigger_prototypes:
                - uuid: dad9fffc29494a8b9d4e6f2a7b9c1d3e
                  expression: 'find(/Barracuda WAF by SNMP/barracuda.vservice.status[{#SVCNAME}],,,"Down")=1'
                  name: 'Virtual service [{#SVCNAME}] is down'
                  event_name: 'Virtual service [{#SVCNAME}] is down: {ITEM.VALUE}'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: HIGH
                  manual_close: 'YES'
                  tags:

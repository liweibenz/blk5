            - uuid: a1a1066370a04a8a8c1d6e3f5a7c9d2e
              name: 'Interface [{#IFNAME}]: Outgoing discards'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'barracuda.net.out.discards[{#IFNAME}]'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT

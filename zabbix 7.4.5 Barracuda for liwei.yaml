              name: 'Virtual service [{#SVCNAME}]: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.20632.8.50.19.1.5.{#SNMPINDEX}'
              key: 'barracuda.vservice.status[{#SVCNAME}]'
